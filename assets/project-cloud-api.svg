  <text x="438" y="294" fill="#5d6b7a" font-family="Arial, sans-serif" font-size="15">/api/alerts</text>
  <rect x="704" y="232" width="134" height="100" rx="12" fill="#ffe9e2" stroke="#d95c3f"/>
