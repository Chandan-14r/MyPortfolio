  <rect x="402" y="402" width="174" height="82" rx="12" fill="#f3f8f6" stroke="#087d8f"/>
  <text x="439" y="439" fill="#075e6c" font-family="Arial, sans-serif" font-size="20" font-weight="700">MongoDB</text>
  <text x="439" y="468" fill="#5d6b7a" font-family="Arial, sans-serif" font-size="15">Alert records</text>
