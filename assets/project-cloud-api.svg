  <text x="116" y="164" fill="#5d6b7a" font-family="Arial, sans-serif" font-size="18">Express routes, MongoDB model, validation, and cloud-ready boundaries</text>
  <rect x="116" y="232" width="154" height="100" rx="12" fill="#dff1ec" stroke="#087d8f"/>
